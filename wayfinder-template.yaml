# Infrastructure-only stack, deployed to `dev` on merge — the template itself.
#
# Parsed strictly: an unrecognised key here is an error, not a warning.
# Everything under skeleton/ is what gets written into the new repository.
#
name: Infrastructure stack (dev on merge)
description: >-
  A Wayfinder stack of cloud resources and nothing else: no application code,
  no container image, no cluster. Every merge to main runs `wf deploy` against
  the dev environment.
icon: terraform

# The repository ships a Wayfinder.yaml and the stack is the point of it.
forStack: true

inputs:
  - name: description
    description: What this infrastructure is for, recorded in the README and on the stack.
    type: string
    optional: true
    defaultValue: ""
    maxLength: 200

  - name: region
    description: >-
      Azure region the stack deploys into. Azure has no default, so a deployment
      without one fails on its first resource.
    type: string
    optional: true
    defaultValue: "uksouth"

# What the scaffolded repository needs in Wayfinder before its pipeline can sign
# in: one service account, trusted only by a workflow run in THIS repository
# whose job declares the `dev` GitHub environment, and able to deploy only to the
# `dev` Wayfinder environment.
#
# Wayfinder does not create it. Scaffolding renders it into manifests and hands
# them to the person scaffolding, who applies them with their own token, so a
# template can hand out no more access than they already hold. 'wf scaffold
# coderepo' asks what to do with them; 'wf get coderepo NAME -w WORKSPACE
# --configuration' answers again afterwards.
#
# The subject names the repository by id as well as by name, which is what stops
# a renamed organisation handing somebody else a token this credential accepts.
# Leave audiences out: Wayfinder stamps the tenant's own when the credential is
# applied, and a template cannot know it.
wayfinderServiceAccounts:
  devDeployer:
    name: dev-${{ .Repo.Name }}-deployer
    roles:
      - role: deployer
        workspace: ${{ .Workspace }}
        environment: dev
      # Wayfinder.yaml names its plans as file:plans/..., which publishes each
      # one to the workspace catalogue as it deploys.
      - role: workspace.cataloguemanagement
        workspace: ${{ .Workspace }}
    trust:
      issuer: https://token.actions.githubusercontent.com
      subject: repo:${{ .Repo.Organization }}@${{ .Repo.OrganizationID }}/${{ .Repo.Name }}@${{ .Repo.ID }}:environment:dev

# GitHub variables, set when the repository is created. The ones with no
# githubEnvironment are repository-wide; the rest are set on the `dev` GitHub
# environment, which is created on the repository because a variable names it —
# and that is what lets the deploy job declare it.
repository:
  variables:
    - name: WAYFINDER_SERVER
      value: ${{ .Wayfinder.Server }}
    - name: WF_REGION
      value: ${{ .Inputs.region }}

    - name: WAYFINDER_SERVICE_ACCOUNT
      value: ${{ .ServiceAccounts.devDeployer.Ref }}
      githubEnvironment: dev
    - name: WAYFINDER_ENVIRONMENT
      value: dev
      githubEnvironment: dev

skeleton:
  path: skeleton

  # Files copied byte for byte. Their contents are NOT rendered, so they must not
  # use the `$${{ }}` escape either — it would land literally.
  #
  # The workflow is full of GitHub Actions' own ${{ }} expressions and ordinary
  # shell ${VAR}, so keeping it raw means it is valid exactly as written, here
  # and in the generated repository. Per-repository values reach it through
  # .wayfinder/ci.env, which IS rendered.
  #
  # These globs are matched with path.Match: `**` is not supported, and `*.yaml`
  # does not match `*.yml`, which is why both are listed.
  raw:
    - ".github/workflows/*.yaml"
    - ".github/workflows/*.yml"
    - ".wayfinder/*.sh"
    # The plans are Wayfinder's own template language throughout. Rendering them
    # here would consume every expression in them.
    - "plans/*.yaml"
