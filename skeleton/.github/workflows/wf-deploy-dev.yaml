# Deploys this repository's infrastructure to the `dev` environment on every
# merge to main.
#
# The first run creates the stack instance <stack>-dev; every later run applies
# whatever changed in Wayfinder.yaml or plans/ to the same instance.
#
# This file is copied into your repository verbatim — Wayfinder does not
# template it. The deploy job reads the WAYFINDER_* variables Wayfinder set on
# the `dev` GitHub environment when it created this repository.
name: Deploy to dev

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token Wayfinder authenticates with

# Deploys queue rather than cancel: a cancelled `wf deploy` can leave a
# half-applied stack.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: make lint

  deploy:
    name: Deploy
    needs: [lint]
    runs-on: ubuntu-latest
    # Scopes the OIDC token to `repo:<owner>/<repo>:environment:dev`, which is
    # what the dev service account trusts, and shows this job the variables set
    # on that environment. A job without this line cannot sign in at all.
    environment: dev
    env:
      WAYFINDER_SERVER: ${{ vars.WAYFINDER_SERVER }}
      WAYFINDER_SERVICE_ACCOUNT: ${{ vars.WAYFINDER_SERVICE_ACCOUNT }}
      WAYFINDER_ENVIRONMENT: ${{ vars.WAYFINDER_ENVIRONMENT }}
      WF_REGION: ${{ vars.WF_REGION }}
      WF_IDENTITY: ${{ vars.WF_IDENTITY }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the Wayfinder CLI
        run: bash .wayfinder/install-wf.sh

      - name: Deploy
        run: |
          set -euo pipefail
          source .wayfinder/ci.env

          # The cloud identity sits in the same workspace as the service
          # account, which is the middle segment of tenant:workspace:name.
          workspace="$(cut -d: -f2 <<<"${WAYFINDER_SERVICE_ACCOUNT}")"

          # One long-lived instance, redeployed on every merge. The name is
          # passed on to the step that writes the summary.
          instance="${WF_STACK_NAME}-dev"
          echo "WF_INSTANCE=${instance}" >> "$GITHUB_ENV"

          wf deploy --non-interactive --timeout 45m \
            -i "${instance}" \
            -e "${WAYFINDER_ENVIRONMENT}" \
            -f Wayfinder.yaml \
            --identity "${WF_IDENTITY:-${workspace}/${WAYFINDER_ENVIRONMENT}/aws-${WAYFINDER_ENVIRONMENT}}" \
            --region "${WF_REGION}" \
            --out-file ./deploy.json

      - name: Summarise
        run: |
          {
            echo "### Deployed to ${WAYFINDER_ENVIRONMENT}"
            echo ""
            echo "- Instance: \`${WF_INSTANCE}\`"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "<details><summary>Component outputs</summary>"
            echo ""
            echo '```json'
            jq '.componentOutputs // {}' ./deploy.json
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
